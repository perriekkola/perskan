name: Auto Release on Merge to main

# Cuts a new release automatically whenever addon code lands on main
# (e.g. a merged PR). The patch version is bumped from the latest v* tag,
# then the addon is packaged and published in one job.
#
# Docs/CI-only changes are ignored (see paths-ignore) so touching the
# workflow or README does not trigger a release. Manual releases via a
# pushed v* tag still work through release.yml.

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "**.md"
      - "README*"
      - "LICENSE*"

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          # Highest existing v* tag, e.g. v1.1.28 (empty on first ever run)
          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -n1)"

          if [ -z "${LATEST}" ]; then
            NEXT="v1.0.0"
          else
            base="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${base}"
            MAJOR="${MAJOR:-1}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
            PATCH=$((PATCH + 1))
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Latest tag: ${LATEST:-<none>} -> next: ${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Package addon zip
        shell: bash
        run: |
          set -euo pipefail

          ADDON_NAME="Perskan"
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP_NAME="${ADDON_NAME}-${VERSION}.zip"

          # Build staging folder that becomes the top-level folder in the zip
          mkdir -p "dist/${ADDON_NAME}"

          # Copy repo contents into dist/Perskan, excluding things you don't want in the addon zip
          rsync -av --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".gitignore" \
            --exclude "README*" \
            --exclude "LICENSE*" \
            --exclude "CLAUDE.md" \
            --exclude "*.psd" --exclude "*.xcf" \
            --exclude "*.zip" \
            --exclude "dist/" \
            ./ "dist/${ADDON_NAME}/"

          # Zip the top-level folder (Perskan/)
          (cd dist && zip -r "../${ZIP_NAME}" "${ADDON_NAME}")

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create tag + GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
